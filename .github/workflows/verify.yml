name: verify

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # `verify` runs both surefire (*Test) and failsafe (*IT); `test` would skip the ITs.
      - run: mvn -B --no-transfer-progress verify
